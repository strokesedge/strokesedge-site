<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: dark green rounded square -->
  <rect width="512" height="512" rx="90" ry="90" fill="#0d2318"/>
  
  <!-- Horizontal speed lines (top group) -->
  <rect x="72" y="148" width="240" height="7" rx="3.5" fill="#6ab83a" opacity="0.9"/>
  <rect x="72" y="168" width="200" height="5" rx="2.5" fill="#6ab83a" opacity="0.6"/>
  <rect x="72" y="184" width="260" height="4" rx="2" fill="#6ab83a" opacity="0.4"/>

  <!-- S — italic serif, green -->
  <text x="108" y="340" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="220" 
        font-style="italic" 
        font-weight="700"
        fill="#6ab83a"
        letter-spacing="-8">S</text>

  <!-- E — italic serif, white/light -->
  <text x="248" y="340" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="220" 
        font-style="italic" 
        font-weight="700"
        fill="#e8ede8"
        letter-spacing="-8">E</text>

  <!-- Bottom single line -->
  <rect x="72" y="368" width="368" height="5" rx="2.5" fill="#6ab83a" opacity="0.7"/>
</svg>
